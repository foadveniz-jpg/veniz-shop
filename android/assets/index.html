<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1B12">
<meta name="description" content="veniz | فروشگاه آنلاین قهوه، اکسسوری و قهوه‌ساز">
<title>veniz | فروشگاه قهوه ونیز</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%232A1B12'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  --espresso:#2A1B12; --brown:#4B2E1E; --brown2:#5D3A26;
  --caramel:#B5773A; --gold:#D9A441; --cream:#F7F1E7; --cream2:#EFE5D6;
  --card:#FFFFFF; --text:#2B2118; --muted:#8A7A6D; --line:#E8DCCB;
  --danger:#C0392B; --green:#2E7D32; --blue:#1D6FB8; --radius:16px;
  --shadow:0 4px 18px rgba(42,27,18,.08); --shadow-lg:0 12px 34px rgba(42,27,18,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;background:var(--cream);color:var(--text);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
::selection{background:var(--gold);color:#fff}
::-webkit-scrollbar{width:10px;height:8px}
::-webkit-scrollbar-thumb{background:#CBB89E;border-radius:8px}
::-webkit-scrollbar-track{background:var(--cream2)}
.container{max-width:1200px;margin:0 auto;padding:0 16px}

/* ---------- Header ---------- */
.site-header{position:sticky;top:0;z-index:50;background:rgba(247,241,231,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.header-in{display:flex;align-items:center;gap:18px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px;color:var(--espresso);letter-spacing:.5px}
.logo .bean{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brown),var(--espresso));display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gold);box-shadow:var(--shadow)}
.logo small{font-size:11px;font-weight:500;color:var(--muted);display:block;line-height:1.2;letter-spacing:0}
.main-nav{display:flex;gap:6px;margin-inline-start:8px}
.main-nav a{padding:8px 14px;border-radius:10px;font-weight:600;color:var(--brown);transition:.2s}
.main-nav a:hover,.main-nav a.active{background:var(--cream2);color:var(--espresso)}
.header-search{flex:1;max-width:420px;position:relative}
.header-search input{width:100%;padding:10px 40px 10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:14px;outline:none;transition:.2s}
.header-search input:focus{border-color:var(--caramel)}
.header-search .s-ico{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
.header-actions{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.icon-btn{position:relative;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--brown);transition:.2s;background:transparent}
.icon-btn:hover{background:var(--cream2)}
.cart-count{position:absolute;top:2px;left:2px;min-width:19px;height:19px;padding:0 5px;background:var(--caramel);color:#fff;border-radius:10px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.user-chip{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:12px;background:var(--cream2);font-weight:600;font-size:13px;color:var(--brown);border:1px solid var(--line);max-width:160px}
.user-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-menu{position:absolute;top:60px;left:16px;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);border:1px solid var(--line);min-width:190px;padding:6px;z-index:60}
.user-menu a,.user-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--text);text-align:right}
.user-menu a:hover,.user-menu button:hover{background:var(--cream)}
.user-menu .um-head{padding:8px 12px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:12px;color:var(--muted)}
.user-menu .um-head b{display:block;color:var(--espresso);font-size:13.5px}

/* ---------- Hero ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;margin-top:18px;min-height:340px;display:flex;align-items:center;background:var(--espresso)}
.hero::before{content:'';position:absolute;inset:0;background:url('https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/a86e6460f040.jpg') center/cover;opacity:.45}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,rgba(26,15,8,.92) 25%,rgba(26,15,8,.35) 70%,transparent)}
.hero-in{position:relative;z-index:2;padding:48px 44px;max-width:600px;color:#fff}
.hero-tag{display:inline-flex;align-items:center;gap:8px;background:rgba(217,164,65,.18);border:1px solid rgba(217,164,65,.5);color:var(--gold);font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:30px;margin-bottom:16px}
.hero h1{font-size:38px;font-weight:900;line-height:1.4;margin-bottom:12px}
.hero h1 em{color:var(--gold);font-style:normal}
.hero p{color:#E4D6C4;font-size:15.5px;margin-bottom:24px;max-width:480px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:13px;font-weight:700;font-size:14px;transition:.2s;border:1.5px solid transparent;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--caramel),var(--brown));color:#fff;box-shadow:0 4px 14px rgba(181,119,58,.35)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(181,119,58,.45)}
.btn-dark{background:var(--espresso);color:#fff}
.btn-dark:hover{background:var(--brown)}
.btn-outline{background:transparent;border-color:var(--caramel);color:var(--caramel)}
.btn-outline:hover{background:var(--caramel);color:#fff}
.btn-ghost{background:var(--cream2);color:var(--brown)}
.btn-ghost:hover{background:#E5D7C2}
.btn-danger{background:#FDF0EE;color:var(--danger);border-color:#F2C6C0}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-gold{background:var(--gold);color:#3B2A12}
.btn-sm{padding:7px 14px;font-size:12.5px;border-radius:10px}
.btn-lg{padding:14px 30px;font-size:15.5px;border-radius:14px}
.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important}

/* ---------- Sections ---------- */
.section{margin:44px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px}
.section-head h2{font-size:22px;font-weight:900;color:var(--espresso);display:flex;align-items:center;gap:10px}
.section-head h2::before{content:'';width:5px;height:24px;border-radius:4px;background:linear-gradient(var(--gold),var(--caramel))}
.section-head a{font-size:13px;font-weight:700;color:var(--caramel)}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cat-card{position:relative;border-radius:var(--radius);overflow:hidden;padding:26px 22px;color:#fff;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;transition:.25s;box-shadow:var(--shadow)}
.cat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.cat-card .cc-ico{position:absolute;top:18px;left:20px;font-size:34px;opacity:.9}
.cat-card h3{font-size:18px;font-weight:800}
.cat-card small{opacity:.85;font-size:12.5px}
.cat-card.c1{background:linear-gradient(135deg,#6B4226,#3E2415)}
.cat-card.c2{background:linear-gradient(135deg,#8A5A33,#54331C)}
.cat-card.c3{background:linear-gradient(135deg,#4B2E1E,#241309)}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:44px 0}
.feature{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;display:flex;gap:13px;align-items:center;box-shadow:var(--shadow)}
.feature .f-ico{width:46px;height:46px;border-radius:13px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.feature b{display:block;font-size:13.5px;color:var(--espresso)}
.feature small{color:var(--muted);font-size:11.5px;line-height:1.6;display:block}

/* ---------- Product cards ---------- */
.prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.prod-card{background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);transition:.25s;display:flex;flex-direction:column;position:relative}
.prod-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:#E0CBA8}
.p-img{position:relative;aspect-ratio:1;background:#F2EADD;cursor:pointer;overflow:hidden}
.p-img img{width:100%;height:100%;object-fit:cover;transition:.4s}
.prod-card:hover .p-img img{transform:scale(1.06)}
.p-badges{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.pbadge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;color:#fff}
.pbadge.sale{background:var(--danger)}
.pbadge.out{background:#6B6B6B}
.pbadge.feat{background:var(--gold);color:#3B2A12}
.p-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.p-cat{font-size:11px;font-weight:700;color:var(--caramel)}
.p-name{font-size:14px;font-weight:700;color:var(--espresso);line-height:1.6;min-height:44px;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-name:hover{color:var(--caramel)}
.p-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto}
.price{display:flex;flex-direction:column;line-height:1.5}
.price .new{font-size:15px;font-weight:900;color:var(--espresso)}
.price .new small{font-size:11px;font-weight:600;color:var(--muted)}
.price .old{font-size:12px;color:var(--muted);text-decoration:line-through}
.add-btn{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--caramel),var(--brown));color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.add-btn:hover{transform:scale(1.08)}
.add-btn:disabled{background:#D8CBBB;cursor:not-allowed;transform:none}

/* ---------- Toolbar / chips ---------- */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 18px;border-radius:30px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--brown);transition:.2s}
.chip:hover{border-color:var(--caramel)}
.chip.active{background:var(--espresso);border-color:var(--espresso);color:#fff}
.sort-select{margin-inline-start:auto}
select.form-control{width:auto}
.count-note{font-size:12.5px;color:var(--muted)}

/* ---------- Product detail ---------- */
.crumbs{font-size:12.5px;color:var(--muted);margin:18px 0 14px}
.crumbs a{color:var(--caramel);font-weight:600}
.pd{display:grid;grid-template-columns:460px 1fr;gap:36px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}
.pd-img{border-radius:16px;overflow:hidden;aspect-ratio:1;background:#F2EADD}
.pd-img img{width:100%;height:100%;object-fit:cover}
.pd-info h1{font-size:24px;font-weight:900;color:var(--espresso);margin:8px 0 6px}
.pd-price{display:flex;align-items:baseline;gap:12px;margin:18px 0}
.pd-price .new{font-size:28px;font-weight:900;color:var(--brown)}
.pd-price .new small{font-size:14px;color:var(--muted);font-weight:600}
.pd-price .old{font-size:16px;color:var(--muted);text-decoration:line-through}
.pd-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:16px;margin-bottom:16px}
.pd-meta b{color:var(--green)}
.pd-desc{font-size:14px;color:#5B4B3C;line-height:2;margin-bottom:22px}
.buy-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.qty-stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.qty-stepper button{width:40px;height:44px;font-size:19px;color:var(--brown);font-weight:800}
.qty-stepper button:hover{background:var(--cream2)}
.qty-stepper input{width:52px;height:44px;text-align:center;border:none;outline:none;font-weight:800;font-size:15px}
.stock-note{font-size:12.5px;font-weight:700}
.stock-note.ok{color:var(--green)}
.stock-note.low{color:var(--danger)}

/* ---------- Cart / checkout ---------- */
.cart-layout{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start;margin:24px 0}
.cart-items{display:flex;flex-direction:column;gap:12px}
.cart-item{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;align-items:center}
.cart-item img{width:86px;height:86px;object-fit:cover;border-radius:12px;background:#F2EADD}
.ci-info{flex:1;min-width:0}
.ci-info .n{font-weight:700;font-size:14px;color:var(--espresso);cursor:pointer}
.ci-info .p{font-size:13px;color:var(--caramel);font-weight:700;margin-top:2px}
.ci-remove{color:var(--danger);font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px}
.ci-remove:hover{background:#FDF0EE}
.ci-total{font-weight:900;font-size:14.5px;color:var(--espresso);min-width:90px;text-align:left}
.summary-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);position:sticky;top:86px}
.summary-card h3{font-size:16px;font-weight:900;color:var(--espresso);margin-bottom:16px}
.sum-row{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;color:#5B4B3C}
.sum-row.total{border-top:1.5px dashed var(--line);margin-top:8px;padding-top:14px;font-size:16px;font-weight:900;color:var(--espresso)}
.free-bar{background:var(--cream2);border-radius:8px;height:8px;overflow:hidden;margin:6px 0 4px}
.free-bar div{height:100%;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:8px;transition:.4s}
.free-note{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.free-note b{color:var(--green)}
.checkout-layout{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start;margin:24px 0}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.panel h3{font-size:16px;font-weight:900;color:var(--espresso);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.panel h3 .step-n{width:26px;height:26px;border-radius:9px;background:var(--espresso);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.pay-opts{display:grid;gap:10px}
.pay-opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;cursor:pointer;transition:.2s}
.pay-opt:hover{border-color:var(--caramel)}
.pay-opt.sel{border-color:var(--caramel);background:#FBF4E8}
.pay-opt input{width:18px;height:18px;accent-color:var(--brown)}
.pay-opt b{font-size:14px;color:var(--espresso);display:block}
.pay-opt small{font-size:11.5px;color:var(--muted);display:block;line-height:1.6}
.pay-opt .po-ico{font-size:24px}

/* ---------- Forms ---------- */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12.5px;font-weight:700;color:var(--brown);margin-bottom:6px}
.form-control{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;transition:.2s;color:var(--text)}
.form-control:focus{border-color:var(--caramel);box-shadow:0 0 0 3px rgba(181,119,58,.12)}
.form-control.err{border-color:var(--danger)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
textarea.form-control{resize:vertical;min-height:80px}
.form-hint{font-size:11px;color:var(--muted);margin-top:4px}
.form-error{background:#FDF0EE;border:1px solid #F2C6C0;color:var(--danger);font-size:12.5px;font-weight:600;border-radius:10px;padding:10px 14px;margin-bottom:14px}

/* ---------- Auth ---------- */
.auth-wrap{max-width:440px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow-lg)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--cream2);border-radius:12px;padding:4px;margin-bottom:22px}
.auth-tabs button{padding:10px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
.auth-tabs button.active{background:#fff;color:var(--espresso);box-shadow:var(--shadow)}
.auth-logo{text-align:center;margin-bottom:18px}
.auth-logo .bean{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--brown),var(--espresso));display:inline-flex;align-items:center;justify-content:center;font-size:28px;color:var(--gold);margin-bottom:10px}
.auth-logo h2{font-size:19px;font-weight:900;color:var(--espresso)}
.auth-logo p{font-size:12.5px;color:var(--muted)}

/* ---------- Gateway ---------- */
.gateway{max-width:480px;margin:34px auto;background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.gw-head{background:linear-gradient(135deg,var(--brown),var(--espresso));color:#fff;padding:22px 24px;display:flex;align-items:center;justify-content:space-between}
.gw-head .t{font-weight:900;font-size:16px}
.gw-head small{display:block;font-size:11px;opacity:.8;font-weight:400}
.gw-amount{background:#FBF4E8;margin:18px 24px 0;border-radius:13px;border:1px dashed var(--gold);padding:14px;text-align:center}
.gw-amount b{font-size:22px;color:var(--brown)}
.gw-amount small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.gw-body{padding:20px 24px 26px}
.gw-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gw-pay{margin-top:8px}
.gw-secure{text-align:center;font-size:11px;color:var(--muted);margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.otp-row{display:flex;gap:8px}
.otp-row .form-control{flex:1}

/* ---------- Result ---------- */
.result-wrap{max-width:520px;margin:46px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:44px 30px;box-shadow:var(--shadow-lg)}
.result-ico{width:84px;height:84px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:40px}
.result-ico.ok{background:#E8F5E9;color:var(--green)}
.result-ico.warn{background:#FFF8E1;color:#B58900}
.result-ico.bad{background:#FDF0EE;color:var(--danger)}
.result-wrap h2{font-size:21px;font-weight:900;color:var(--espresso);margin-bottom:8px}
.result-wrap p{color:var(--muted);font-size:13.5px;margin-bottom:6px}
.result-code{display:inline-block;background:var(--cream2);border-radius:10px;padding:8px 18px;font-weight:900;color:var(--brown);font-size:15px;margin:10px 0 18px;letter-spacing:1px}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}

/* ---------- Account / orders ---------- */
.orders-list{display:flex;flex-direction:column;gap:12px}
.order-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.order-card .oc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.order-card .code{font-weight:900;color:var(--espresso);letter-spacing:.5px}
.ochip{font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px}
.ochip.pending{background:#FFF8E1;color:#9A7B00}
.ochip.processing{background:#E8F0FE;color:var(--blue)}
.ochip.shipped{background:#EDE7F6;color:#6A4BA4}
.ochip.delivered{background:#E8F5E9;color:var(--green)}
.ochip.canceled{background:#FDF0EE;color:var(--danger)}
.ochip.paid{background:#E8F5E9;color:var(--green)}

<script>
/* ================= veniz shop — core ================= */
'use strict';

/* ---------- helpers ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa = n => Number(n || 0).toLocaleString('fa-IR');
const money = n => fa(n) + ' تومان';
const faDate = iso => { try { return new Date(iso).toLocaleDateString('fa-IR', {year:'numeric',month:'long',day:'numeric'}); } catch(e){ return ''; } };
const faTime = iso => { try { return new Date(iso).toLocaleTimeString('fa-IR', {hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; } };
const uid = () => 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const IMG_FALLBACK = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23F2EADD'/%3E%3Ctext x='100' y='115' font-size='64' text-anchor='middle'%3E%E2%98%95%3C/text%3E%3C/svg%3E";
const imgTag = (src, cls, alt) => `<img ${cls ? 'class="' + cls + '" ' : ''}src="${esc(src || IMG_FALLBACK)}" alt="${esc(alt || '')}" loading="lazy" onerror="this.onerror=null;this.src='${IMG_FALLBACK}'">`;

function toast(msg, type) {
  const w = $('#toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = '.4s'; setTimeout(() => t.remove(), 400); }, 2600);
}
function openModal(html, small) {
  closeModal();
  const r = $('#modal-root');
  r.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal ${small ? 'modal-sm' : ''}">${html}</div></div>`;
}
function closeModal() { $('#modal-root').innerHTML = ''; }
function confirmBox(msg, onYes) {
  window.__confirmCb = onYes;
  openModal(`
    <div class="m-head"><h3>تأیید عملیات</h3><button class="m-close" onclick="closeModal()">✕</button></div>
    <div class="m-body">
      <p style="font-size:14px;color:#5B4B3C;margin-bottom:20px">${esc(msg)}</p>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="closeModal()">انصراف</button>
        <button class="btn btn-danger" onclick="closeModal();window.__confirmCb && window.__confirmCb()">بله، انجام بده</button>

}

/* ---------- storage ---------- */
const DB = {

    { id: 'p1', name: 'قهوه اسپرسو بلند ونیز — ۲۵۰ گرم', category: 'coffee', price: 485000, oldPrice: 540000, stock: 40, featured: true, image: 'https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/f04b961136fa.png', desc: 'میکس عربیکا و روبوستای باکیفیت با رست متوسط-تیره؛ مناسب اسپرسوساز، موکاپات و کاپوچینوساز. کرمای غلیظ، عطر شکلاتی با ته‌مزه کارامل. تاریخ رست: کمتر از یک ماه.', createdAt: Date.now() - 86400000 * 30 },

    { id: 'p3', name: 'قهوه ترک‌ساز ونیز — ۲۵۰ گرم', category: 'coffee', price: 390000, oldPrice: 0, stock: 30, featured: false, image: 'https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/b4d22412cb94.png', desc: 'رست تیره با آسیاب فوق ریز، مخصوص دم‌آوری سنتی ترکی و قهوه‌جوش. بدنه غلیظ، عطر تلخ-شیرین متعادل و ماندگاری بالا.', createdAt: Date.now() - 86400000 * 27 },
    { id: 'p4', name: 'قهوه تک‌خاستگاه برزیل سانتوس ونیز — ۲۵۰ گرم', category: 'coffee', price: 620000, oldPrice: 690000, stock: 18, featured: true, image: 'https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/2fd58d528730.jpg', desc: 'صددرصد عربیکا از مزارع سانتوس برزیل؛ رست متوسط با نت‌های آجیل و شکلات شیری، اسیدیته پایین و بدنه لطیف. مناسب دم‌آوری V60 و فرنچ‌پرس.', createdAt: Date.now() - 86400000 * 25 },
    { id: 'p5', name: 'قهوه لوانت ونیز (میکس عربیکا ۸۰٪) — ۲۵۰ گرم', category: 'coffee', price: 540000, oldPrice: 0, stock: 22, featured: false, image: 'https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/a86e6460f040.jpg', desc: 'بلند لایت با ۸۰ درصد عربیکا؛ مناسب دوست‌داران قهوه با اسیدیته ملایم و عطر میوه‌ای. انتخابی عالی برای دم‌آوری قطره‌ای و پورآور.', createdAt: Date.now() - 86400000 * 22 },
    { id: 'p6', name: 'فرنچ پرس ونیز ۳۵۰ میلی‌لیتری', category: 'accessory', price: 890000, oldPrice: 990000, stock: 15, featured: true, image: 'https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/165a0ecb87f3.jpg', desc: 'بدنه پیرکس مقاوم با فیلتر استیل ضدزنگ و دسته‌ی ارگونومیک؛ دم‌آوری ۴ فنجان قهوه در کمتر از ۵ دقیقه، بدون نیاز به فیلتر کاغذی.', createdAt: Date.now() - 86400000 * 20 },
    { id: 'p7', name: 'ست دراپر V60 ونیز + سرنگ مخصوص', category: 'accessory', price: 780000, oldPrice: 0, stock: 12, featured: false, image: 'https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/a1811713cc75.png', desc: 'دراپر سرامیکی با طراحی مارپیچ داخلی برای عصاره‌گیری یکنواخت، همراه کتری و سرنگ اندازه‌گیری؛ کیت کامل پورآور برای شروع قهوه تخصصی.', createdAt: Date.now() - 86400000 * 18 },
    { id: 'p8', name: 'آسیاب دستی قهوه ونیز — تیغه فولادی', category: 'accessory', price: 1980000, oldPrice: 2250000, stock: 8, featured: true, image: 'https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/3f6883aca567.jpg', desc: 'تیغه‌های فولادی سرامیکی با ۱۵ درجه تنظیم درشت‌ورد آسیاب؛ از قهوه ترک تا فرنچ‌پرس. بدنه آلومینیومی و کیس حمل مسافرتی.', createdAt: Date.now() - 86400000 * 15 },
    { id: 'p9', name: 'فروتر شیر برقی ونیز', category: 'accessory', price: 690000, oldPrice: 0, stock: 14, featured: false, image: 'https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/c4edf1072e59.jpg', desc: 'ساخت فوم شیر غلیظ برای لاته و کاپوچینو در ۲ دقیقه؛ گرم‌کن غیرمستقیم، ضدچکیدن و قابل شست‌وشو.', createdAt: Date.now() - 86400000 * 12 },
    { id: 'p10', name: 'موکاپات ونیز ۳ فنجانه', category: 'machine', price: 1450000, oldPrice: 1580000, stock: 10, featured: true, image: 'https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/825a946ebbbc.jpg', desc: 'موکاپات ایتالیایی با بدنه آلومینیوم ریختگی و دسته‌ی نسوز؛ مناسب اجاق گاز و برقی. تهیه ۳ فنجان اسپرسو غلیظ در ۴ دقیقه.', createdAt: Date.now() - 86400000 * 10 },
    { id: 'p11', name: 'قهوه‌ساز اسپرسو ونیز مدل V-200', category: 'machine', price: 18500000, oldPrice: 19900000, stock: 5, featured: true, image: 'https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/9de683af9419.jpg', desc: 'پمپ ۲۰ بار ایتالیایی با بویلر استیل، بخارجوش حرفه‌ای برای فوم شیر و مخزن ۱.۵ لیتری؛ همراه فیلتر پود و کپسول. ۲۴ ماه گارانتی ونیز.', createdAt: Date.now() - 86400000 * 7 },
    { id: 'p12', name: 'کاپوچینوساز ونیز مدل C-100', category: 'machine', price: 12400000, oldPrice: 0, stock: 4, featured: false, image: 'https://z-cdn.chatglm.cn/image-search-mcp/images-ppt/2c61112e29e9.jpg', desc: 'قهوه‌ساز و کاپوچینوساز خانگی با فیلتر دائمی، بخارجوش چرخان و سیستم پیش‌گرم فنجان؛ طراحی جمع‌وجور مناسب آشپزخانه.', createdAt: Date.now() - 86400000 * 4 }
  ]);
  if (!DB.get('veniz_users')) DB.set('veniz_users', []);
  if (!DB.get('veniz_orders')) DB.set('veniz_orders', []);

/* ---------- data access ---------- */
const getProducts = () => DB.get('veniz_products', []);
const saveProducts = p => DB.set('veniz_products', p);
const getUsers = () => DB.get('veniz_users', []);
const saveUsers = u => DB.set('veniz_users', u);
const getOrders = () => DB.get('veniz_orders', []);
const saveOrders = o => DB.set('veniz_orders', o);
const getSettings = () => DB.get('veniz_settings', { shippingCost: 65000, freeShipping: 500000 });
const getProduct = id => getProducts().find(p => p.id === id);

/* ---------- auth ---------- */
const ADMIN_USER = 'admin';
const ADMIN_PASS = 'veniz1404';

  if (!sid) return null;
  return getUsers().find(u => u.id === sid) || null;
}
function isAdmin() { return DB.get('veniz_admin', false) === true; }
function registerUser(name, phone, pass) {

  users.push(u);
  saveUsers(users);
  DB.set('veniz_session', u.id);
  return { ok: true, user: u };
}
function loginUser(phone, pass) {

  if (!u || u.pass !== pass) return { err: 'شماره موبایل یا رمز عبور اشتباه است.' };

  return { ok: true, user: u };
}
function logoutUser() { localStorage.removeItem('veniz_session'); }
function adminLogin(user, pass) {

/* ---------- cart ---------- */
const getCart = () => DB.get('veniz_cart', []);
const saveCart = c => DB.set('veniz_cart', c);
function cartCount() { return getCart().reduce((s, i) => s + i.qty, 0); }
function cartSubtotal() {
  return getCart().reduce((s, i) => {
    const p = getProduct(i.id);
    return p ? s + p.price * i.qty : s;
  }, 0);
}
function shippingOf(subtotal) {
  const st = getSettings();
  return subtotal >= st.freeShipping ? 0 : st.shippingCost;
}
function addToCart(id, qty) {
  const p = getProduct(id);
  if (!p) return toast('محصول یافت نشد', 'err');
  if (p.stock <= 0) return toast('این محصول ناموجود است', 'err');
  qty = Math.max(1, qty || 1);
  const cart = getCart();
  const it = cart.find(i => i.id === id);
  const cur = it ? it.qty : 0;
  if (cur + qty > p.stock) { toast('بیشتر از موجودی انبار نمی‌توان سفارش داد', 'err'); qty = p.stock - cur; if (qty <= 0) return; }
  if (it) it.qty += qty; else cart.push({ id, qty });
  saveCart(cart);
  updateBadges();
  toast('به سبد خرید اضافه شد ✓', 'ok');
}
function setCartQty(id, qty) {
  const p = getProduct(id);
  if (!p) return;
  qty = Math.max(1, Math.min(qty, p.stock, 99));
  const cart = getCart();
  const it = cart.find(i => i.id === id);
  if (it) { it.qty = qty; saveCart(cart); }
  route();
}
function removeFromCart(id) {
  saveCart(getCart().filter(i => i.id !== id));
  updateBadges();
  route();
}
function clearCart() { saveCart([]); updateBadges(); }
function updateBadges() {
  $$('.cart-count').forEach(el => {
    const c = cartCount();
    el.textContent = fa(c);
    el.style.display = c ? 'flex' : 'none';
  });
}

/* ---------- orders ---------- */
function createOrder({ customer, payMethod, note }) {
  const cart = getCart();
  if (!cart.length) return null;
  const products = getProducts();
  // validate stock again
  for (const it of cart) {
    const p = products.find(x => x.id === it.id);
    if (!p || p.stock < it.qty) { toast('موجودی «' + (p ? p.name : it.id) + '» کافی نیست', 'err'); return null; }
  }
  for (const it of cart) {
    const p = products.find(x => x.id === it.id);
    p.stock -= it.qty;
  }
  saveProducts(products);
  const subtotal = cart.reduce((s, i) => s + getProduct(i.id).price * i.qty, 0);
  const seq = DB.get('veniz_seq', 1000);
  DB.set('veniz_seq', seq + 1);
  const order = {
    id: uid(),
    code: 'VNZ-' + seq,
    userId: currentUser() ? currentUser().id : null,
    items: cart.map(i => { const p = getProduct(i.id); return { productId: i.id, name: p.name, price: p.price, qty: i.qty, image: p.image }; }),
    subtotal,
    shipping: shippingOf(subtotal),
    total: subtotal + shippingOf(subtotal),
    payMethod,
    payStatus: payMethod === 'cod' ? 'cod' : 'pending',
    status: 'pending',
    customer,
    note: note || '',
    createdAt: new Date().toISOString(),
    history: [{ at: new Date().toISOString(), txt: 'ثبت سفارش' }]
  };
  const orders = getOrders();
  orders.unshift(order);
  saveOrders(orders);
  clearCart();
  return order;
}
function setOrderStatus(id, status) {
  const orders = getOrders();
  const o = orders.find(x => x.id === id);
  if (!o) return;
  if (status === 'canceled' && o.status !== 'canceled') {
    // restock
    const products = getProducts();
    o.items.forEach(it => { const p = products.find(x => x.id === it.productId); if (p) p.stock += it.qty; });
    saveProducts(products);
  }
  if (o.status === 'canceled' && status !== 'canceled') {
    // re-cancel protection: take stock back
    const products = getProducts();
    o.items.forEach(it => { const p = products.find(x => x.id === it.productId); if (p) p.stock = Math.max(0, p.stock - it.qty); });
    saveProducts(products);
  }
  o.status = status;
  o.history = o.history || [];
  o.history.push({ at: new Date().toISOString(), txt: 'تغییر وضعیت به «' + ORDER_STATUS[status] + '»' });
  saveOrders(orders);
}

/* ---------- router ---------- */
function route() {
  closeModal();
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  const q = {};
  if (qs) qs.split('&').forEach(kv => { const [k, v] = kv.split('='); q[k] = decodeURIComponent(v || ''); });
  const app = $('#app');
  window.scrollTo(0, 0);

  // admin area
  if (parts[0] === 'admin') {
    if (!isAdmin()) { location.hash = 'admin-login'; return; }
    renderAdmin(parts.slice(1), app);
    return;
  }
  if (parts[0] === 'admin-login') {
    if (isAdmin()) { location.hash = 'admin'; return; }
    app.innerHTML = adminLoginView();
    return;
  }

  let body = '';
  const seg = parts[0] || 'home';
  switch (seg) {
    case 'home': body = homeView(); break;
    case 'shop': body = shopView(q); break;
    case 'product': body = productView(parts[1]); break;
    case 'cart': body = cartView(); break;
    case 'checkout': body = checkoutView(); break;
    case 'pay': app.innerHTML = payView(parts[1]); return;
    case 'result': app.innerHTML = resultView(parts[1]); return;
    case 'auth': body = authView(q); break;
    case 'account': body = accountView(); break;
    default: body = homeView();
  }
  const active = seg === 'product' ? 'shop' : seg;
  app.innerHTML = headerHTML(active) + body + footerHTML() + bottomNavHTML(active);
  if (seg === 'shop') __refreshShopGrid();
  updateBadges();
}
window.addEventListener('hashchange', route);

/* ---------- APP handlers (inline events) ---------- */
const APP = {
  search(e) { e.preventDefault(); const v = ($('#globalQ') || {}).value || ''; SHOP.cat = 'all'; SHOP.q = v; go('shop'); setTimeout(() => { const i = $('#shopQ'); if (i) i.value = v; __refreshShopGrid(); }, 0); return false; },
  toggleUserMenu(e) {
    e.stopPropagation();
    const m = $('#userMenu');
    if (!m) return;
    if (m.style.display !== 'none') { m.style.display = 'none'; return; }
    m.innerHTML = userMenuHTML();
    const b = e.currentTarget.getBoundingClientRect();
    m.style.display = 'block';
    m.style.top = (b.bottom + 8) + 'px';
    m.style.left = '16px';
    m.style.right = 'auto';
    m.onclick = ev => ev.stopPropagation();
    document.addEventListener('click', APP._closeMenu);
  },
  _closeMenu() { const m = $('#userMenu'); if (m) m.style.display = 'none'; document.removeEventListener('click', APP._closeMenu); },
  logout() { logoutUser(); toast('از حساب خارج شدید', 'ok'); go(''); route(); },
  shopNav(c) { SHOP.cat = c; SHOP.q = ''; go('shop'); route(); },
  shopCat(c) { SHOP.cat = c; SHOP.q = ''; go('shop'); route(); },
  shopQ(v) { SHOP.q = v; __refreshShopGrid(); },
  shopSort(v) { SHOP.sort = v; __refreshShopGrid(); },
  pdQty(d) { const i = $('#pdQty'); if (!i) return; const max = +i.max || 99; i.value = Math.min(max, Math.max(1, (+i.value || 1) + d)); },
  buyNow(id, immediate) {
    const i = $('#pdQty'); const qty = i ? (+i.value || 1) : 1;
    addToCart(id, qty);
    if (immediate) go('checkout');
  },
  cartQty(id, d) {
    const it = getCart().find(x => x.id === id);
    if (it) setCartQty(id, it.qty + d);
  },
  cartSet(id, v) { setCartQty(id, +v || 1); },
  goCheckout() {
    if (!currentUser()) { toast('برای ثبت سفارش ابتدا وارد حساب شوید', 'err'); go('auth?next=checkout'); return; }
    go('checkout');
  },
  pickPay(m) {
    $$('.pay-opt').forEach(el => el.classList.remove('sel'));
    const el = $('#payOpt' + (m === 'cod' ? 'Cod' : 'Online'));
    if (el) { el.classList.add('sel'); el.querySelector('input').checked = true; }
  },
  placeOrder() {
    const val = id => (($('#' + id) || {}).value || '').trim();
    const data = { name: val('coName'), phone: val('coPhone'), city: val('coCity'), zip: val('coZip'), address: val('coAddr') };
    const note = val('coNote');
    const errEl = $('#coErr');
    const showErr = m => { errEl.innerHTML = `<div class="form-error">${m}</div>`; errEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
    if (data.name.length < 3) return showErr('نام و نام خانوادگی را کامل وارد کنید.');
    if (!/^09\d{9}$/.test(data.phone)) return showErr('شماره موبایل باید ۱۱ رقم و با ۰۹ شروع شود.');
    if (data.city.length < 2) return showErr('نام شهر را وارد کنید.');
    if (data.address.length < 10) return showErr('نشانی کامل را وارد کنید (حداقل ۱۰ کاراکتر).');
    const method = ($('#payOptCod input') || {}).checked ? 'cod' : 'online';
    const u = currentUser();
    const order = createOrder({ customer: data, payMethod: method, note });
    if (!order) return;
    // save address to user profile for next time (optional nicety)
    if (u) { u.lastAddr = data; saveUsers(getUsers()); }
    toast('سفارش با کد ' + order.code + ' ثبت شد ✓', 'ok');
    go(method === 'online' ? 'pay/' + order.id : 'result/' + order.id);
  },
  sendOtp(btn) {
    btn.disabled = true;
    let s = 60;
    const input = $('#gwOtp');
    if (input) input.value = '12345';
    toast('رمز پویا ارسال شد: ۱۲۳۴۵', 'ok');
    const t = setInterval(() => { s--; if (s <= 0) { clearInterval(t); btn.disabled = false; btn.textContent = 'دریافت کد'; } else btn.textContent = 'ارسال مجدد (' + fa(s) + ')'; }, 1000);
  },
  payNow(orderId) {
    const otp = ($('#gwOtp') || {}).value || '';
    if (otp !== '12345') { toast('رمز پویا صحیح نیست (کد آزمایشی: ۱۲۳۴۵)', 'err'); return; }
    const btn = $('#gwPayBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> در حال اتصال به بانک...';
    setTimeout(() => {
      btn.innerHTML = '<span class="spin"></span> در حال تأیید تراکنش...';
      setTimeout(() => {
        const orders = getOrders();
        const o = orders.find(x => x.id === orderId);
        if (o) {
          o.payStatus = 'paid';
          o.history = o.history || [];
          o.history.push({ at: new Date().toISOString(), txt: 'پرداخت آنلاین با موفقیت انجام شد' });
          saveOrders(orders);
        }
        go('result/' + orderId);
        toast('پرداخت با موفقیت انجام شد ✓', 'ok');
      }, 1300);
    }, 1200);
  },
  authTab(which) {
    $('#tabLogin').classList.toggle('active', which === 'login');
    $('#tabReg').classList.toggle('active', which === 'reg');
    $('#formLogin').style.display = which === 'login' ? '' : 'none';
    $('#formReg').style.display = which === 'reg' ? '' : 'none';
    $('#authErr').innerHTML = '';
  },
  doLogin(e) {
    e.preventDefault();
    const err = m => $('#authErr').innerHTML = `<div class="form-error">${m}</div>`;
    const phone = ($('#liPhone').value || '').trim().replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g, '');
    const pass = $('#liPass').value;
    if (!/^09\d{9}$/.test(phone)) return err('شماره موبایل معتبر وارد کنید (مثال: 09123456789).');
    const r = loginUser(phone, pass);
    if (r.err) return err(r.err);
    toast('خوش آمدید ' + r.user.name + ' 👋', 'ok');
    go(window.__authNext === 'checkout' ? 'checkout' : '');
    if (window.__authNext === 'checkout') route();
  },
  doRegister(e) {
    e.preventDefault();
    const err = m => $('#authErr').innerHTML = `<div class="form-error">${m}</div>`;
    const name = ($('#rgName').value || '').trim();
    const phone = ($('#rgPhone').value || '').trim().replace(/\D/g, '');
    const p1 = $('#rgPass').value, p2 = $('#rgPass2').value;
    if (name.length < 3) return err('نام و نام خانوادگی را کامل وارد کنید.');
    if (!/^09\d{9}$/.test(phone)) return err('شماره موبایل باید ۱۱ رقم و با ۰۹ شروع شود.');
    if (p1.length < 6) return err('رمز عبور باید حداقل ۶ کاراکتر باشد.');
    if (p1 !== p2) return err('تکرار رمز عبور مطابقت ندارد.');
    const r = registerUser(name, phone, p1);
    if (r.err) return err(r.err);
    toast('عضویت شما در ونیز انجام شد 🎉', 'ok');
    go(window.__authNext === 'checkout' ? 'checkout' : '');
    if (window.__authNext === 'checkout') route();
  },
  orderDetail(id) { orderDetailModal(id); }
};

function adminTop(title, extra) {

}

function renderAdmin(sub, app) {
  const seg = sub[0] || 'dashboard';
  let inner = '';
  if (seg === 'products') inner = adminProducts();
  else if (seg === 'orders') inner = adminOrders();
  else if (seg === 'users') inner = adminUsers();
  else if (seg === 'settings') inner = adminSettings();
  else inner = adminDashboard();
  app.innerHTML = `<div class="admin-layout">${adminSidebar(seg)}<div class="admin-main">${inner}</div></div>`;
  if (seg === 'orders') APP._renderOrd();
  updateBadges();
}

          </div>
          <div class="form-group">
            <label class="form-label">آدرس تصویر محصول</label>
            <input class="form-control" id="pfImg" style="direction:ltr;text-align:left" value="${p ? esc(p.image || '') : ''}" placeholder="https://..." oninput="APP.imgPreview(this.value)">
            <div id="pfPrev" style="margin-top:8px">${p ? imgTag(p.image, 'thumb', '') : ''}</div>
            <p class="form-hint">می‌توانید لینک تصویر از اینترنت بدهید؛ اگر خالی بماند، آیکون پیش‌فرض قهوه نمایش داده می‌شود.</p>
          </div>
          <div class="form-group"><label class="form-label">توضیحات محصول</label><textarea class="form-control" id="pfDesc" placeholder="ویژگی‌ها، طعم، مشخصات...">${p ? esc(p.desc || '') : ''}</textarea></div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--brown);margin-bottom:16px">
            <input type="checkbox" id="pfFeat" ${p && p.featured ? 'checked' : ''} style="width:17px;height:17px;accent-color:var(--brown)"> نمایش در بخش «محصولات ویژه» صفحه اصلی
          </label>
          <div style="display:flex;gap:10px;justify-content:flex-end">
            <button type="button" class="btn btn-ghost" onclick="closeModal()">انصراف</button>
            <button class="btn btn-primary">${p ? 'ذخیره تغییرات' : 'افزودن محصول'} ✓</button>
          </div>
        </form>
      </div>`);
  },
  imgPreview(src) { $('#pfPrev').innerHTML = imgTag(src, 'thumb', ''); },
  saveProduct(e, id) {
    e.preventDefault();
    const err = m => $('#pfErr').innerHTML = `<div class="form-error">${m}</div>`;
    const name = ($('#pfName').value || '').trim();
    const category = $('#pfCat').value;
    const stock = Math.max(0, parseInt($('#pfStock').value, 10) || 0);
    const price = parseInt($('#pfPrice').value, 10) || 0;
    const old = parseInt($('#pfOld').value, 10) || 0;
    const image = ($('#pfImg').value || '').trim();
    const desc = ($('#pfDesc').value || '').trim();
    const featured = ($('#pfFeat').checked);
    if (name.length < 3) return err('نام محصول باید حداقل ۳ کاراکتر باشد.');
    if (price <= 0) return err('قیمت باید عددی بزرگ‌تر از صفر باشد.');
    if (old && old <= price) return err('قیمت «قبل از تخفیف» باید بزرگ‌تر از قیمت فعلی باشد.');
    const ps = getProducts();
    if (id) {
      const p = ps.find(x => x.id === id);
      Object.assign(p, { name, category, stock, price, oldPrice: old, image, desc, featured });
      toast('تغییرات ذخیره شد ✓', 'ok');
    } else {
      ps.unshift({ id: uid(), name, category, price, oldPrice: old, stock, featured, image, desc, createdAt: Date.now() });
      toast('محصول جدید اضافه شد ✓', 'ok');
    }
    saveProducts(ps);
    closeModal();
    route();
    return false;
  },
  /* orders */
  ordFilter(s) { ADMIN_ORDER_FILTER.status = s; $$('#ordChips .chip').forEach(c => c.classList.toggle('active', c.textContent.trim() === (s === 'all' ? 'همه' : ORDER_STATUS[s]))); APP._renderOrd(); },
  ordQ(v) { ADMIN_ORDER_FILTER.q = v; APP._renderOrd(); },
  _renderOrd() { const w = $('#ordTableWrap'); if (w) w.innerHTML = adminOrdersTable(); },
  orderStatus(id, status, code) {
    if (status === 'canceled') {
      confirmBox('سفارش ' + code + ' لغو شود؟ موجودی اقلام به انبار برمی‌گردد.', () => {
        setOrderStatus(id, 'canceled');
        toast('سفارش لغو شد و موجودی برگشت خورد', 'ok');
        route();
      });
    } else {
      setOrderStatus(id, status);
      toast('وضعیت سفارش ' + code + ' به «' + ORDER_STATUS[status] + '» تغییر کرد', 'ok');
      route();
    }
  },
  /* settings */
  saveSettings() {
    const ship = parseInt($('#setShip').value, 10) || 0;
    const free = parseInt($('#setFree').value, 10) || 0;
    if (free < 0 || ship < 0) return;
    DB.set('veniz_settings', { shippingCost: ship, freeShipping: free });
    toast('تنظیمات ذخیره شد ✓', 'ok');
  }
});

/* ---------- boot ---------- */
seedIfEmpty();
route();

</script>
</body>
</html>
